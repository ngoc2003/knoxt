name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 9.0.0

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/freelancer_notebook_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm --filter database generate

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Run tests with coverage
        run: pnpm test:ci

      - name: Build applications
        run: pnpm build

      - name: Verify quality gates did not modify tracked files
        run: git diff --exit-code

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Build production images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: false
          tags: freelancer-notebook-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          tags: freelancer-notebook-web:ci
          build-args: |
            VITE_API_URL=http://localhost:3000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
